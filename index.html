<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c9eeeb">
  <title>36 | LENORMAND</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<div class="app">
  <div class="sea-light sea-light-1"></div><div class="sea-light sea-light-2"></div>
  <i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i><i class="bubble b4"></i>

  <section id="home" class="screen active">
    <header class="hero">
      <div class="shell">🐚</div>
      <h1>36</h1>
      <div class="brand">LENORMAND</div>
      <div class="tagline">~ whispers from the sea ~</div>
    </header>
    <div class="pearl-panel">
      <button class="menu-btn" onclick="startReading(1)"><span>🫧</span><div><b>1 CARD</b><small>今日のテーマをみる</small></div></button>
      <button class="menu-btn" onclick="startReading(3)"><span>🐚</span><div><b>3 CARDS</b><small>3枚で状況を読む</small></div></button>
      <button class="menu-btn" onclick="showLibrary()"><span>🦪</span><div><b>CARD LIBRARY</b><small>36枚のカードを学ぶ</small></div></button>
    </div>
    <footer>~ whispers from the sea ~</footer>
  </section>

  <section id="setup" class="screen">
    <button class="back" onclick="showScreen('home')">← HOME</button>
    <div class="section-shell">🐚</div>
    <h2 id="setupTitle">NEW READING</h2>
    <p class="sub">質問を海にそっと預けてください</p>
    <label class="field-label">QUESTION</label>
    <textarea id="question" maxlength="180" placeholder="例：今の関係について知っておくことは？"></textarea>

    <label class="field-label">DRAW STYLE</label>
    <div class="segmented">
      <button id="virtualBtn" class="selected" onclick="setMode('virtual')">VIRTUAL</button>
      <button id="physicalBtn" onclick="setMode('physical')">PHYSICAL</button>
    </div>

    <div id="virtualArea">
      <button class="primary" onclick="drawVirtual()">🐚 DRAW CARDS</button>
    </div>

    <div id="physicalArea" class="hidden">
      <p class="hint">実物で引いたカードを記録してください</p>
      <div id="physicalSelects"></div>
      <button class="primary" onclick="submitPhysical()">結果を見る</button>
    </div>
  </section>

  <section id="result" class="screen">
    <button class="back" onclick="showScreen('setup')">← BACK</button>
    <div class="section-shell">🐚</div>
    <h2>YOUR READING</h2>
    <div id="resultQuestion" class="question-card"></div>
    <div id="resultCards" class="cards"></div>
    <div class="combination">
      <span>COMBINATION</span>
      <strong id="comboNames"></strong>
      <p id="comboHint"></p>
    </div>
    <button class="primary" onclick="copyPrompt()">🫧 AI READING PROMPT をコピー</button>
    <div id="copyStatus" class="copy-status"></div>
    <button class="secondary" onclick="newReading()">NEW READING</button>
  </section>

  <section id="library" class="screen">
    <button class="back" onclick="showScreen('home')">← HOME</button>
    <div class="section-shell">🦪</div>
    <h2>CARD LIBRARY</h2>
    <p class="sub">まずはCOREから。使いながら一緒に育てる36枚。</p>
    <div id="libraryGrid" class="library-grid"></div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
